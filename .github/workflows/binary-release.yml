name: binary-release

on:
  workflow_call:
    inputs:
      PACKAGE_NAME:
        required: true
        type: string
      RELEASE_TAG:
        required: false
        type: string

jobs:
  binary-release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch-name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: true
            file-ext:

          - arch-name: x86_64-unknown-linux-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            file-ext:

          - arch-name: x86_64-unknown-freebsd
            os: ubuntu-latest
            target: x86_64-unknown-freebsd
            cross: true
            file-ext:

          - arch-name: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            file-ext: .exe

          - arch-name: x86_64-pc-windows-gnu
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            cross: true
            file-ext: .exe

          - arch-name: x86_64-apple-darwin
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            file-ext:

          - arch-name: i686-unknown-linux-gnu
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            cross: true
            file-ext:

          - arch-name: i686-unknown-linux-musl
            os: ubuntu-latest
            target: i686-unknown-linux-musl
            cross: true
            file-ext:

          - arch-name: i686-pc-windows-msvc
            os: windows-latest
            target: i686-pc-windows-msvc
            cross: false
            file-ext: .exe

          - arch-name: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            file-ext:

          - arch-name: aarch64-unknown-linux-musl
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            file-ext:

          - arch-name: aarch64-apple-darwin
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            file-ext:

          - arch-name: armv7-unknown-linux-gnueabi
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabi
            cross: true
            file-ext:

          - arch-name: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross: true
            file-ext:

          - arch-name: armv7-unknown-linux-musleabi
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabi
            cross: true
            file-ext:

          - arch-name: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            cross: true
            file-ext:

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.RELEASE_TAG || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2.86.6
        with:
          tool: cross

      - name: Get package metadata
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq '${{ inputs.PACKAGE_NAME }}' }
          if ($null -eq $package) {
            throw 'Package ${{ inputs.PACKAGE_NAME }} was not found'
          }
          $releaseTag = '${{ github.event.release.tag_name || inputs.RELEASE_TAG }}'
          if ($releaseTag) {
            $expectedTag = '${{ inputs.PACKAGE_NAME }}-' + $package.version
            if ($releaseTag -ne $expectedTag) {
              throw "Release tag '$releaseTag' does not match package version '$expectedTag'"
            }
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($package.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build with cross
        if: matrix.cross
        run: cross build --locked --release -p ${{ inputs.PACKAGE_NAME }} --target ${{ matrix.target }}

      - name: Build with Cargo
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release -p ${{ inputs.PACKAGE_NAME }} --target ${{ matrix.target }}

      - name: Move binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $source = 'target/${{ matrix.target }}/release/${{ inputs.PACKAGE_NAME }}${{ matrix.file-ext }}'
          $destination = 'artifacts/${{ inputs.PACKAGE_NAME }}-${{ steps.package.outputs.version }}-${{ matrix.arch-name }}${{ matrix.file-ext }}'
          Move-Item $source $destination

      - name: Calculate SHA256
        shell: pwsh
        run: |
          $name = '${{ inputs.PACKAGE_NAME }}-${{ steps.package.outputs.version }}-${{ matrix.arch-name }}${{ matrix.file-ext }}'
          $path = Join-Path artifacts $name
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -NoNewline "$path.sha256sum"

      - name: Upload binaries to release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "artifacts/*"
          name: ${{ github.event.release.name || format('{0}-{1}', inputs.PACKAGE_NAME, steps.package.outputs.version) }}
          tag: ${{ github.event.release.tag_name || inputs.RELEASE_TAG || format('{0}-{1}', inputs.PACKAGE_NAME, steps.package.outputs.version) }}
          commit: ${{ github.sha }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          prerelease: ${{ steps.package.outputs.prerelease }}
