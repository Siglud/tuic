name: library-release

on:
  workflow_call:
    inputs:
      PACKAGE_NAME:
        required: true
        type: string

jobs:
  library-release:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get package metadata
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq '${{ inputs.PACKAGE_NAME }}' }
          if ($null -eq $package) {
            throw 'Package ${{ inputs.PACKAGE_NAME }} was not found'
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          "prerelease=$($package.version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Release library
        uses: ncipollo/release-action@v1.21.0
        with:
          name: ${{ inputs.PACKAGE_NAME }}-${{ steps.package.outputs.version }}
          tag: ${{ inputs.PACKAGE_NAME }}-${{ steps.package.outputs.version }}
          commit: ${{ github.sha }}
          allowUpdates: true
          prerelease: ${{ steps.package.outputs.prerelease }}
