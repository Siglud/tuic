name: release-tuic-client

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      RELEASE_TAG:
        description: Existing release tag to upload binaries to
        required: false
        type: string

jobs:
  release-tuic-client:
    permissions:
      contents: write

    uses: ./.github/workflows/binary-release.yml
    with:
      PACKAGE_NAME: "tuic-client"
