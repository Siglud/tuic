name: release-tuic-client

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release-tuic-client:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'tuic-client-')
    permissions:
      contents: write

    uses: ./.github/workflows/binary-release.yml
    with:
      PACKAGE_NAME: "tuic-client"
