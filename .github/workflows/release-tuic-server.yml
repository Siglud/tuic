name: release-tuic-server

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release-tuic-server:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'tuic-server-')
    permissions:
      contents: write

    uses: ./.github/workflows/binary-release.yml
    with:
      PACKAGE_NAME: "tuic-server"
