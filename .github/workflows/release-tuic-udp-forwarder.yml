name: release-tuic-udp-forwarder

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      RELEASE_TAG:
        description: Existing release tag to upload binaries to
        required: false
        type: string

jobs:
  release-tuic-udp-forwarder:
    permissions:
      contents: write

    uses: ./.github/workflows/binary-release.yml
    with:
      PACKAGE_NAME: "tuic-udp-forwarder"
