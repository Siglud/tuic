[package]
name = "tuic-quinn"
version = "0.1.0"
authors = ["EAimTY <ea.imty@gmail.com>"]
description = "A thin layer on top of quinn to provide functions for TUIC"
categories = ["network-programming"]
keywords = ["network", "proxy", "quic", "tuic"]
edition = "2021"
rust-version = "1.65.0"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/EAimTY/tuic"

[dependencies]
bytes = { version = "1.11.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.32", default-features = false, features = ["io", "std"] }
quinn = { version = "0.11.9", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"] }
thiserror = { version = "2.0.18", default-features = false }
tuic = { path = "../tuic", default-features = false, features = ["async_marshal", "marshal", "model"] }
uuid = { version = "1.22.0", default-features = false, features = ["std"] }
