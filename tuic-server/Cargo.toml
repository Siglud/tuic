[package]
name = "tuic-server"
version = "1.0.0"
authors = ["EAimTY <ea.imty@gmail.com>"]
description = "Minimalistic TUIC server implementation as a reference"
categories = ["network-programming"]
keywords = ["network", "proxy", "quic", "tuic"]
edition = "2021"
rust-version = "1.65.0"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/EAimTY/tuic"

[dependencies]
bytes = { version = "1.11.1", default-features = false, features = ["std"] }
crossbeam-utils = { version = "0.8.21", default-features = false, features = ["std"] }
env_logger = { version = "0.11.9", default-features = false, features = ["humantime"] }
humantime = { version = "2.3.0", default-features = false }
lexopt = { version = "0.3.2", default-features = false }
log = { version = "0.4.29", default-features = false, features = ["serde", "std"] }
parking_lot = { version = "0.12.5", default-features = false }
quinn = { version = "0.11.9", default-features = false, features = ["futures-io", "runtime-tokio", "rustls-ring"] }
register-count = { version = "0.1.0", default-features = false, features = ["std"] }
rustls = { version = "0.23.23", default-features = false, features = ["ring"] }
rustls-pemfile = { version = "2.2.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
socket2 = { version = "0.5.9", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.50.0", default-features = false, features = ["io-util", "macros", "net", "parking_lot", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["compat"] }
tuic = { path = "../tuic", default-features = false }
tuic-quinn = { path = "../tuic-quinn", default-features = false }
uuid = { version = "1.22.0", default-features = false, features = ["serde", "std"] }
